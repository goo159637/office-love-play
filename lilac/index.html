<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>라일락 하숙집</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#2b2233; --paper:#fffaf6; --accent:#a77bd0; --accent-2:#d4bdea;
  --box:rgba(255,250,246,.93); --box-line:rgba(167,123,208,.55);
  --thought:#cbbfda; --narr:#e9def5;
  --eunbi:#9a6bb8; --soha:#3f6fa8; --daon:#e0608a; --rumi:#2f9e78; --seola:#a3364e; --me:#7a6a8a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--box:rgba(255,248,244,.94)}}
:root[data-theme="dark"]{--box:rgba(255,248,244,.94)}
#rotate{display:none;position:fixed;left:0;right:0;top:0;padding:10px 16px;text-align:center;font-size:14px;
  color:#fff;background:rgba(167,123,208,.9);z-index:50}
@media (orientation:portrait) and (max-width:820px){#rotate{display:block}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#120e16;color:var(--ink);overflow:hidden;
  font-family:"Gowun Dodum",system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
/* 16:9 stage, scaled by JS via --s */
#stage{position:relative;width:1920px;height:1080px;transform:scale(var(--s,0.5));transform-origin:center;
  overflow:hidden;background:#000;flex:none}
.layer{position:absolute;inset:0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity .7s ease}
.bg.on{opacity:1}
#chars{pointer-events:none}
.char{position:absolute;bottom:0;transform:translateX(-50%);transition:left .45s ease,opacity .4s ease,filter .3s ease;opacity:0}
.char.on{opacity:1}
.char.dim{filter:brightness(.72) saturate(.85)}
.char img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:contain;transition:opacity .22s ease}
.char img.out{opacity:0}
#cg{opacity:0;transition:opacity .6s ease;background:#000;pointer-events:none}
#cg.on{opacity:1}
#cg img{width:100%;height:100%;object-fit:cover}
/* dialogue */
/* 화면 아래 전체 폭의 어두운 반투명 띠 */
#box{position:absolute;left:0;right:0;bottom:0;height:300px;color:#fff;
  background:linear-gradient(to top,rgba(16,9,26,.94) 0%,rgba(16,9,26,.86) 62%,rgba(16,9,26,.55) 88%,rgba(16,9,26,0) 100%);
  border-top:2px solid rgba(190,150,230,.45);
  padding:92px 260px 30px 300px;font-size:40px;line-height:1.6;transition:opacity .3s;text-shadow:0 2px 6px rgba(0,0,0,.6)}
#box.hide{opacity:0;pointer-events:none}
#name{position:absolute;top:30px;left:110px;min-width:160px;padding:6px 26px;border-radius:10px;
  font-family:"Jua",sans-serif;font-size:38px;color:#fff;background:var(--accent);text-align:center;
  box-shadow:0 4px 14px rgba(0,0,0,.35);text-shadow:none}
#name.none{display:none}
#text{white-space:pre-wrap;word-break:keep-all}
#text.narr{color:var(--narr)}
#text.thought{color:var(--thought);font-style:italic}
#next{position:absolute;right:120px;bottom:40px;width:0;height:0;border-left:16px solid transparent;
  border-right:16px solid transparent;border-top:22px solid var(--accent);animation:bob 1s infinite;opacity:0}
#next.on{opacity:1}
@keyframes bob{50%{transform:translateY(8px)}}
/* menu bar */
#bar{position:absolute;right:60px;bottom:250px;display:flex;gap:8px;z-index:5}
#bar button,.btn{font-family:"Jua",sans-serif;border:0;cursor:pointer;border-radius:999px;
  background:rgba(255,255,255,.82);color:var(--ink);font-size:26px;padding:8px 22px;box-shadow:0 3px 10px rgba(0,0,0,.2)}
#bar button{background:rgba(30,18,44,.62);color:#efe6fa;font-size:22px;padding:6px 18px;border:1px solid rgba(200,170,240,.35);box-shadow:none}
#bar button.act{background:var(--accent);color:#fff}
/* choices */
#choices{display:none;flex-direction:column;align-items:flex-start;justify-content:flex-end;gap:6px;
  padding:0 0 48px 110px;background:linear-gradient(to top,rgba(16,9,26,.55) 0%,rgba(16,9,26,0) 45%);z-index:6}
#choices.on{display:flex}
/* 선택지: 왼쪽 아래, 배경 없이 글자만 */
#choices button{width:auto;max-width:1500px;text-align:left;font-family:"Gowun Dodum",sans-serif;font-size:38px;
  padding:8px 26px 8px 22px;border:0;border-left:4px solid transparent;border-radius:8px;background:transparent;
  color:#fff;cursor:pointer;text-shadow:0 2px 8px rgba(0,0,0,.85),0 0 2px rgba(0,0,0,.9);transition:background .15s,border-color .15s,padding .15s}
#choices button::before{content:"▸ ";color:var(--accent-2)}
#choices button:hover,#choices button:focus-visible{background:rgba(167,123,208,.28);border-left-color:var(--accent-2);padding-left:30px;outline:none}
#box.choosing #text,#box.choosing #name,#box.choosing #next{visibility:hidden}
/* toast */
#toast{position:absolute;top:50px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;align-items:center;pointer-events:none}
.t{font-family:"Jua",sans-serif;font-size:34px;padding:10px 28px;border-radius:999px;background:rgba(255,255,255,.92);
  box-shadow:0 4px 14px rgba(0,0,0,.25);animation:tin 2.2s forwards}
@keyframes tin{0%{opacity:0;transform:translateY(-10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
/* screens & modals */
.screen{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column}
.screen.on{display:flex}
#title{background:#fff;justify-content:flex-start;overflow:hidden}
/* 표지: 캐릭터별 사선 컬러 패널 */
#title .panels{position:absolute;inset:0;display:flex;pointer-events:none}
.tp{position:relative;flex:1;margin:0 -34px;transform:skewX(-9deg);overflow:hidden;border-left:10px solid #fff;
  box-shadow:inset 12px 0 18px rgba(0,0,0,.08)}
.tp:first-child{margin-left:-90px}.tp:last-child{margin-right:-90px}
.tp .bgp{position:absolute;inset:-60px;background:repeating-linear-gradient(118deg,var(--c1) 0 22px,var(--c2) 22px 44px)}
.tp .bgp::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%)}
.tp img{position:absolute;left:50%;transform:translateX(-50%) skewX(9deg);filter:drop-shadow(0 6px 14px rgba(60,20,50,.25))}
#title::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,0) 52%,rgba(255,236,244,.55) 72%,rgba(255,226,238,.92) 100%)}
/* 로고 */
#title .logo2{position:absolute;z-index:3;left:50%;top:548px;transform:translateX(-50%) rotate(-3deg);display:flex;flex-direction:column;align-items:center}
#title .logo2 .ln{font-family:"Jua",sans-serif;font-size:150px;line-height:1.02;color:#fff;letter-spacing:6px;padding:0 46px 14px;
  -webkit-text-stroke:19px #9a5cc6;paint-order:stroke fill;text-shadow:0 12px 0 #5e2f86,0 24px 34px rgba(80,0,40,.35);
  background:rgba(255,246,250,.82);border:7px solid #9a5cc6;border-radius:34px;box-shadow:0 10px 0 #5e2f86}
#title .logo2 .ln.l2{margin-top:18px;margin-left:200px}
#title .logo2 .deco{position:absolute;top:178px;left:-150px;width:640px;height:52px}
#title .sub{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:484px;font-family:"Jua",sans-serif;font-size:40px;color:#fff;
  padding:6px 30px;border-radius:999px;background:#9a5cc6;box-shadow:0 6px 0 #5e2f86;white-space:nowrap}
#title .menu{position:absolute;z-index:3;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:28px}
.big{font-size:42px;padding:18px 70px;min-width:380px}
#title .menu .big{min-width:320px;padding:18px 50px}
.setlbl{font-family:"Jua",sans-serif;font-size:36px;margin-bottom:16px}
#resList{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.btn.res{display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:20px;padding:16px 10px;font-size:32px;border:3px solid #f3dbe3;background:#fff;box-shadow:none}
.btn.res small{font-family:"Gowun Dodum",sans-serif;font-size:22px;color:#8a7d96}
.btn.res.act{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.res.act small{color:#fff}
#title .menu .big{border:5px solid #9a5cc6;box-shadow:0 7px 0 #5e2f86;color:#5e2f86;background:#fff}
#title .menu .big:hover{background:#9a5cc6;color:#fff}
.modal{background:rgba(20,10,25,.6);z-index:20}
.panel{background:var(--paper);border-radius:32px;padding:50px 60px;min-width:900px;max-width:1500px;max-height:900px;
  overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);font-size:34px}
.panel h2{font-family:"Jua",sans-serif;font-size:56px;margin-bottom:28px;color:var(--accent)}
.panel input{font:inherit;font-size:44px;padding:14px 24px;border-radius:16px;border:3px solid var(--accent-2);width:100%;margin:10px 0 30px}
.row{display:flex;gap:18px;justify-content:flex-end;margin-top:20px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:18px 26px;border-radius:18px;
  background:#fff;border:2px solid #f3dbe3;margin-bottom:14px}
.slot .info{font-size:28px;color:#6b5f78}
.aff{display:grid;grid-template-columns:200px 1fr 210px;white-space:nowrap;align-items:center;gap:20px;margin:14px 0}
.aff .barbg{height:28px;border-radius:999px;background:#f3e6ec;overflow:hidden}
.aff .fill{height:100%;border-radius:999px}
.affmax{margin-top:18px;font-size:24px;opacity:.75;text-align:center}
#log .entry{padding:12px 0;border-bottom:1px dashed #ecd6df}
#log .who{font-family:"Jua",sans-serif;margin-right:14px}
#end .panel{text-align:center}
.hint{font-size:26px;color:#8a7d96;margin-top:10px}
</style>
</head>
<body>
<div id="rotate">📱 휴대폰은 가로로 돌리면 더 크게 보여요</div>
<div id="wrap"><div id="stage">
  <div id="bgs" class="layer"></div>
  <div id="chars" class="layer"></div>
  <div id="cg" class="layer"><img alt=""></div>
  <div id="box" class="hide"><div id="name" class="none"></div><div id="text"></div><div id="next"></div></div>
  <div id="bar" style="display:none">
    <button data-a="log">로그</button><button data-a="auto">오토</button><button data-a="skip">스킵</button>
    <button data-a="aff">호감도</button><button data-a="save">저장</button><button data-a="load">불러오기</button><button data-a="title">타이틀</button>
  </div>
  <div id="choices" class="layer"></div>
  <div id="toast"></div>

  <div id="title" class="screen on">
    <div class="panels"></div>
    <div class="sub">오래된 하숙집, 다섯 명의 이웃</div>
    <div class="logo2">
      <svg class="deco" viewBox="0 0 760 60" aria-hidden="true">
        <path d="M10 30 C 200 6, 560 54, 690 30" fill="none" stroke="#9a5cc6" stroke-width="7" stroke-linecap="round"/>
        <rect x="684" y="8" width="54" height="44" rx="8" fill="#fff" stroke="#9a5cc6" stroke-width="6"/>
        <path d="M711 42 C 694 31, 696 18, 705 18 C 709 18, 711 22, 711 24 C 711 22, 713 18, 717 18 C 726 18, 728 31, 711 42 Z" fill="#9a5cc6"/>
      </svg>
      <div class="ln l1">라일락</div>
      <div class="ln l2">하숙집</div>
    </div>
    <div class="menu">
      <button class="btn big" data-t="new">새로 시작</button>
      <button class="btn big" data-t="load">불러오기</button>
      <button class="btn big" data-t="set">설정</button>
    </div>
  </div>
  <div id="m-name" class="screen modal"><div class="panel">
    <h2>주인공 이름</h2><div>라일락 하우스 새 하숙생. 이름을 정해 주세요.</div>
    <input id="nameIn" maxlength="6" value="김도현">
    <div class="row"><button class="btn" data-close>취소</button><button class="btn" id="nameOk" style="background:var(--accent);color:#fff">출근하기</button></div>
  </div></div>
  <div id="m-set" class="screen modal"><div class="panel">
    <h2>설정</h2>
    <div class="setlbl">해상도</div>
    <div id="resList"></div>
    <div id="winSize" class="hint"></div>
    <div class="row" style="justify-content:space-between"><button class="btn" id="fsBtn">전체 화면</button><button class="btn" data-close>닫기</button></div>
  </div></div>
  <div id="m-slots" class="screen modal"><div class="panel"><h2 id="slotsTitle">저장</h2><div id="slotList"></div>
    <div class="row"><button class="btn" data-close>닫기</button></div></div></div>
  <div id="m-ask" class="screen modal"><div class="panel" style="min-width:820px;text-align:center">
    <div id="askMsg" style="font-size:40px;line-height:1.5;margin:10px 0 30px"></div>
    <div class="row" style="justify-content:center"><button class="btn big" id="askNo">취소</button><button class="btn big" id="askYes" style="background:var(--accent);color:#fff">확인</button></div>
  </div></div>
  <div id="m-aff" class="screen modal"><div class="panel"><h2>호감도</h2><div id="affList"></div>
    <div class="hint">2주 차가 끝날 때 가장 높은 사람의 루트로 갑니다. (8 미만이면…?)</div>
    <div class="row"><button class="btn" data-close>닫기</button></div></div></div>
  <div id="m-log" class="screen modal"><div class="panel" style="width:1500px"><h2>대사 로그</h2><div id="log"></div>
    <div class="row"><button class="btn" data-close>닫기</button></div></div></div>
  <div id="end" class="screen modal"><div class="panel">
    <h2 id="endHead">데모 끝!</h2><div id="endMsg">다음 이야기는 준비 중이에요.</div>
    <div id="endAff" style="margin-top:30px;text-align:left"></div>
    <div class="row" style="justify-content:center"><button class="btn big" id="endTitle">타이틀로</button></div>
  </div></div>
</div></div>
<script src="story.js"></script>
<script src="engine.js"></script>
</body>
</html>
